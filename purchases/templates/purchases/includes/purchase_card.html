<div class="col-md-6 col-lg-4 mb-3">
    <article class="card purchase-card h-100">
        <div class="card-body">
            <h5 class="card-title">
                {{ purchase.product.name|default:"Без названия" }}
            </h5>
            <p class="card-text">
                <strong>Цена:</strong> {{ purchase.price|floatformat:2 }} руб.
            </p>
            <p class="card-text">
                <strong>Категория:</strong> {{ purchase.category.name }}
            </p>
            <p class="card-text">
                <strong>Магазин:</strong> {{ purchase.store.name }}
            </p>
            <a
                href="{% url 'purchases:detail' purchase.id %}"
                class="btn btn-sm btn-primary"
            >
                Подробнее
            </a>
        </div>
    </article>
</div>
