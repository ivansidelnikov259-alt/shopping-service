{% extends "base.html" %}
{% block title %}{{ title }} - Shopping Service{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<p>Вы уверены, что хотите удалить "{{ object }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'purchases:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
