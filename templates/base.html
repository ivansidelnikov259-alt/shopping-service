{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="bg-light">
    {% include "includes/navigation.html" %}
    
    <main class="container my-4">
        <!-- Вывод данных из контекстного процессора -->
        <div class="alert alert-info d-flex justify-content-between">
            <span>Добро пожаловать в <strong>{{ site_name }}</strong>!</span>
            <span>
                Всего покупок: <strong>{{ purchases_count }}</strong> | 
                Категорий: <strong>{{ categories_count }}</strong>
            </span>
        </div>

        {% block content %}
        {% endblock %}
    </main>
    
    <footer class="container text-center text-muted mt-5 mb-3">
        <p>© <span id="current-year"></span> {{ site_name }}</p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
